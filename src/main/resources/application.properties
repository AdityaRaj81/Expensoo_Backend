#################################################
# Application
#################################################

spring.application.name=expensoo-backend
server.port=${PORT:8080}

#################################################
# PostgreSQL Database (Neon)
#################################################

spring.datasource.url=jdbc:postgresql://ep-red-boat-ao9rgbgp-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_Qn4aT6MAbUym
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#################################################
# Hikari Connection Pool
#################################################

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

#################################################
# Hibernate / JPA
#################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#################################################
# Jackson
#################################################

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

#################################################
# Flyway
#################################################

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

#################################################
# JWT
#################################################

jwt.secret=${JWT_SECRET:expensoo-super-secret-key-change-this-before-production-please-change}
jwt.expiration=86400000
jwt.issuer=Expensoo
jwt.header=Authorization
jwt.prefix=Bearer

#################################################
# CORS
#################################################

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

#################################################
# Logging
#################################################

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=OFF